# Documentation: https://goreleaser.com
version: 2

builds:
- main: ./cmd
  binary: kubelearn
  env:
  - CGO_ENABLED=0
  goos:
  - linux
  - darwin
  - windows
  goarch:
  - amd64
  - arm64
  - arm
  ldflags: -s -w

checksum:
  name_template: 'checksums.txt'

archives:
- formats: [binary]
  format_overrides:
  - goos: windows
    formats: [zip]
